<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coforge · AI-Native Mortgage — MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Mulish:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ===== tokens — copied verbatim from the reference design ===== */
:root{
  --coral-50:#FEF1ED; --coral-100:#FCDDD3; --coral-200:#FABBA7; --coral-400:#F37A5C;
  --coral-500:#F06048; --coral-600:#D84B34; --coral-700:#B23A28;
  --teal-50:#E9F6F2; --teal-100:#C7E9DF; --teal-200:#8FD3C0; --teal-400:#2BA487;
  --teal-500:#189078; --teal-600:#137963; --teal-700:#0F614F;
  --navy-50:#EDF0F6; --navy-100:#D3DAE8; --navy-200:#A3B0CC; --navy-300:#6E80A6;
  --navy-400:#3C5180; --navy-500:#1E3A78; --navy-600:#15295A; --navy-700:#0E1E45; --navy-800:#0A2140;
  --amber-400:#F4A85C; --amber-500:#F09048; --gold-400:#F4CB4A;
  --lavender-50:#F4F4FC; --lavender-100:#ECEBFB; --lavender-200:#DAD9F4;
  --neutral-0:#FFFFFF; --neutral-50:#F7F8FB; --neutral-100:#EEF1F6; --neutral-200:#E1E6EE;
  --neutral-300:#CBD3DF; --neutral-400:#9AA6B6; --neutral-500:#6C7889; --neutral-600:#4A5667;
  --neutral-700:#323D4C; --neutral-800:#1C2533;
  --status-success:var(--teal-500); --status-warning:var(--amber-500);
  --status-danger:#D8362B; --status-danger-soft:#FCEAE8; --status-info:var(--navy-500);
  --surface-page:var(--neutral-50); --surface-card:var(--neutral-0); --surface-sunken:var(--neutral-100);
  --text-strong:var(--navy-800); --text-body:var(--neutral-700);
  --text-muted:var(--neutral-500); --text-faint:var(--neutral-400);
  --border-subtle:var(--neutral-200); --border-default:var(--neutral-300);
  --font-display:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Mulish',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --text-3xs:0.6875rem; --text-2xs:0.75rem; --text-xs:0.8125rem; --text-sm:0.875rem;
  --text-md:0.9375rem; --text-lg:1.0625rem; --text-xl:1.25rem; --text-2xl:1.5rem; --text-3xl:1.875rem;
  --tracking-tight:-0.01em; --tracking-caps:0.08em;
  --radius-xs:4px; --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-xl:20px; --radius-pill:999px;
  --shadow-xs:0 1px 2px rgba(10,33,64,.06);
  --shadow-sm:0 1px 3px rgba(10,33,64,.08),0 1px 2px rgba(10,33,64,.04);
  --shadow-md:0 4px 12px rgba(10,33,64,.08),0 2px 4px rgba(10,33,64,.05);
  --shadow-lg:0 12px 28px rgba(10,33,64,.12),0 4px 8px rgba(10,33,64,.06);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font-body);background:var(--surface-page);color:var(--text-body);
  font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
svg{display:block;flex:none}
.mono{font-family:var(--font-mono)}
.oxs-scroll::-webkit-scrollbar{width:9px;height:9px}
.oxs-scroll::-webkit-scrollbar-thumb{background:var(--neutral-300);border-radius:99px}
.oxs-scroll::-webkit-scrollbar-track{background:transparent}
@keyframes oxsPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.35)}}
@keyframes oxsFadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes tin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* ===== DS primitives ===== */
.ds-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:var(--radius-md);
  font-family:var(--font-display);font-weight:600;transition:.15s;white-space:nowrap;
  height:38px;padding:0 16px;font-size:var(--text-sm)}
.ds-btn.sm{height:32px;padding:0 12px;font-size:var(--text-xs);border-radius:var(--radius-sm)}
.ds-btn:disabled{opacity:.45;cursor:not-allowed}
.v-primary{background:var(--coral-500);color:#fff}
.v-primary:hover:not(:disabled){background:var(--coral-600)}
.v-secondary{background:var(--navy-700);color:#fff}
.v-secondary:hover:not(:disabled){background:var(--navy-800)}
.v-teal{background:var(--teal-500);color:#fff}
.v-teal:hover:not(:disabled){background:var(--teal-600)}
.v-outline{background:#fff;border:1px solid var(--border-default);color:var(--text-body)}
.v-outline:hover:not(:disabled){border-color:var(--neutral-400);background:var(--neutral-50)}
.v-ghost{background:transparent;color:var(--text-muted)}
.v-ghost:hover:not(:disabled){background:var(--neutral-100);color:var(--text-body)}
.v-danger{background:#fff;border:1px solid var(--status-danger);color:var(--status-danger)}
.v-danger:hover:not(:disabled){background:var(--status-danger-soft)}

.ds-badge{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;
  border-radius:var(--radius-pill);font-size:var(--text-3xs);font-weight:800;
  letter-spacing:.02em;white-space:nowrap;font-family:var(--font-body)}
.ds-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.t-success{background:var(--teal-50);color:var(--teal-600)}
.t-warning{background:#FDF1E3;color:#B96A20}
.t-danger{background:var(--status-danger-soft);color:var(--status-danger)}
.t-info{background:var(--navy-50);color:var(--navy-500)}
.t-neutral{background:var(--neutral-100);color:var(--neutral-600)}
.t-brand{background:var(--coral-50);color:var(--coral-600)}

.ds-tag{display:inline-flex;align-items:center;height:21px;padding:0 8px;border-radius:var(--radius-sm);
  font-size:var(--text-3xs);font-weight:700}
.tag-coral{background:var(--coral-50);color:var(--coral-700)}
.tag-teal{background:var(--teal-50);color:var(--teal-700)}
.tag-lavender{background:var(--lavender-100);color:var(--navy-500)}

.ds-card{background:var(--surface-card);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);
  box-shadow:var(--shadow-sm);overflow:hidden;font-family:var(--font-body)}
.ds-card>.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:16px 18px 0;color:var(--text-strong)}
.ds-card>.hd.toned{padding:14px 18px;color:#fff}
.ds-card>.hd.navy{background:var(--navy-800)}
.ds-card>.hd.teal{background:var(--teal-500)}
.ds-card>.hd.coral{background:var(--coral-500)}
.ds-card>.hd>.ttl{font-family:var(--font-display);font-weight:600;font-size:var(--text-lg)}
.ds-card>.bd{padding:18px}
.ds-card>.bd.flush{padding:0}

.ds-stat{background:var(--surface-card);border-radius:var(--radius-lg);border:1px solid var(--border-subtle);
  box-shadow:var(--shadow-sm);padding:16px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:12px}
.ds-stat .lb{font-family:var(--font-display);font-weight:600;font-size:var(--text-sm);margin-bottom:2px}
.ds-stat .vl{font-family:var(--font-display);font-weight:800;font-size:var(--text-3xl);
  color:var(--text-strong);line-height:1;letter-spacing:var(--tracking-tight)}
.ds-stat .sb{font-size:var(--text-xs);color:var(--text-muted);margin-top:6px}
.ds-stat .ic{width:44px;height:44px;border-radius:var(--radius-md);flex:none;
  display:flex;align-items:center;justify-content:center}

.ds-avatar{border-radius:var(--radius-pill);display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-display);font-weight:600;flex:none;user-select:none}

.ds-bar{height:5px;border-radius:99px;background:var(--neutral-100);overflow:hidden}
.ds-bar>i{display:block;height:100%;border-radius:99px;transition:width .4s}

/* ===== login ===== */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.login{width:980px;max-width:100%;display:grid;grid-template-columns:1fr 1fr;
  border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--shadow-lg);background:var(--surface-card)}
.login-l{background:var(--navy-800);color:#fff;padding:48px 44px;display:flex;flex-direction:column;
  justify-content:space-between;min-height:560px}
.login-r{padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
.mark{width:40px;height:40px;border-radius:11px;background:var(--coral-500);display:flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;
  font-size:20px;color:#fff;flex:none}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:var(--text-xs);font-weight:700;color:var(--text-strong)}
.field input{height:44px;padding:0 14px;border:1px solid var(--border-subtle);
  border-radius:var(--radius-md);font-size:15px;outline:none;transition:.15s}
.field input:focus{border-color:var(--coral-500);box-shadow:0 0 0 3px rgba(240,96,72,.28)}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;
  border-bottom:1px solid var(--neutral-100);width:100%;text-align:left}
.acct:last-child{border-bottom:none}
.acct:hover{background:var(--neutral-50)}

/* ===== shell ===== */
.hdr{height:64px;flex:none;background:var(--navy-800);color:#fff;display:flex;align-items:center;
  padding:0 22px;gap:18px;position:sticky;top:0;z-index:30}
.hdr-mark{width:34px;height:34px;border-radius:9px;background:var(--coral-500);display:flex;
  align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:17px}
.scanbtn{flex:none;white-space:nowrap;display:flex;align-items:center;gap:8px;height:40px;padding:0 18px;
  border-radius:var(--radius-pill);background:var(--coral-500);color:#fff;font-family:var(--font-display);
  font-weight:600;font-size:14px;box-shadow:0 2px 10px rgba(240,96,72,.4)}
.scanbtn:hover{background:var(--coral-600)}
.ctl{width:34px;height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#fff;display:flex;align-items:center;justify-content:center}
.ctl:hover{background:rgba(255,255,255,.14)}
.ctl.on{background:var(--coral-500);border-color:var(--coral-500)}
.spd{display:flex;align-items:center;background:rgba(255,255,255,.06);border-radius:7px;padding:2px;gap:2px}
.spd button{height:26px;padding:0 8px;border-radius:6px;font-family:var(--font-mono);
  font-size:11px;font-weight:600;color:#fff}
.spd button.on{background:var(--coral-500)}
.roleSel{height:32px;border-radius:7px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.06);color:#fff;font-size:12px;padding:0 6px}
.roleSel option{color:#000}

.banner{background:linear-gradient(90deg,var(--navy-800),var(--navy-600));color:#fff;
  padding:12px 28px;display:flex;align-items:center;gap:18px}

.side{width:248px;flex:none;background:var(--surface-card);border-right:1px solid var(--border-subtle);
  overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:3px}
.sb-eyebrow{font-size:var(--text-3xs);font-weight:800;letter-spacing:var(--tracking-caps);
  text-transform:uppercase;color:var(--text-faint);padding:4px 14px 8px}
.sb-i{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;text-align:left;
  border-radius:var(--radius-md);font-size:var(--text-md);font-weight:600;
  color:var(--text-body);position:relative;transition:background .15s}
.sb-i:hover:not(:disabled){background:var(--neutral-100)}
.sb-i.on{background:var(--coral-50);color:var(--coral-700)}
.sb-i.on::before{content:'';position:absolute;left:0;top:8px;bottom:8px;width:3px;
  border-radius:3px;background:var(--coral-500)}
.sb-i .ico{display:flex;width:20px;justify-content:center;color:var(--text-muted)}
.sb-i.on .ico{color:var(--coral-500)}
.sb-i .cnt{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--coral-600);
  background:var(--coral-50);border-radius:99px;padding:1px 7px}
.sb-i.on .cnt{color:var(--coral-700);background:#fff}
.sb-i:disabled{opacity:.34;cursor:not-allowed}

.ptitle{margin-bottom:18px}
.ptitle h2{font-family:var(--font-display);font-weight:700;font-size:var(--text-2xl);
  color:var(--text-strong);letter-spacing:var(--tracking-tight)}
.ptitle p{font-size:var(--text-sm);color:var(--text-muted);margin-top:3px}

.grid{display:grid;gap:16px}
.g5{grid-template-columns:repeat(5,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}

.tbl{width:100%;border-collapse:collapse;font-family:var(--font-body)}
.tbl th{text-align:left;padding:11px 14px;font-size:11px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--text-muted);background:var(--neutral-50);white-space:nowrap}
.tbl td{padding:12px 14px;font-size:13px;color:var(--text-body);border-top:1px solid var(--neutral-100)}
.tbl tbody tr:hover{background:var(--neutral-50)}

.mini{flex:1;text-align:center;background:#fff;border:1px solid var(--border-subtle);
  border-radius:9px;padding:8px 4px}
.mini b{display:block;font-family:var(--font-display);font-weight:800;font-size:20px}
.mini span{font-size:10.5px;color:var(--text-muted)}

.seg{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--border-default);
  background:#fff;color:var(--text-body);font-size:12.5px;font-weight:600}
.seg.on{border-color:var(--coral-500);background:var(--coral-50);color:var(--coral-700)}

.log{max-height:430px;overflow-y:auto}
.log-l{display:flex;gap:9px;padding:8px 16px;font-size:12.3px;line-height:1.45;
  border-bottom:1px solid var(--neutral-100)}
.log-l:last-child{border-bottom:none}
.log-l .t{font-family:var(--font-mono);font-size:10.5px;color:var(--text-faint);flex:none;padding-top:2px}
.log-l .a{font-weight:800;flex:none}
.log-l.ai .a{color:var(--teal-600)}
.log-l.human .a{color:var(--coral-600)}

.exc{position:relative;border:1px solid var(--border-subtle);border-radius:12px;background:#fff;
  box-shadow:var(--shadow-sm);animation:oxsFadeUp .25s ease}
.exc.crit{border-color:var(--coral-200)}
.exc .top{padding:13px 16px;border-bottom:1px solid var(--neutral-100);display:flex;
  align-items:flex-start;gap:10px}
.exc .bod{padding:13px 16px;display:flex;flex-direction:column;gap:11px}
.snapbox{flex:1;background:var(--neutral-50);border:1px solid var(--border-subtle);
  border-radius:8px;padding:8px 11px;min-width:0}
.caps{font-size:10.5px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em}
.kvr{display:flex;gap:8px;font-size:12.5px;padding:2px 0}
.kvr>.k{color:var(--text-muted);width:96px;flex:none;font-weight:700}

.cond{display:flex;align-items:flex-start;gap:11px;padding:10px 0;border-bottom:1px solid var(--neutral-100)}
.cond:last-child{border-bottom:none}
.chk{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--border-default);flex:none;
  display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff}
.chk.on{background:var(--teal-500);border-color:var(--teal-500)}
.chk.auto{background:var(--teal-500);border-color:var(--teal-500);opacity:.55}

.emptyst{margin-top:16px;padding:48px 24px;text-align:center;background:#fff;
  border:1px dashed var(--border-default);border-radius:14px}
.emptyst .ib{width:48px;height:48px;border-radius:12px;background:var(--navy-50);
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}

.rolecard{margin:8px 6px 2px;padding:12px 13px;border-radius:12px;background:var(--navy-50);
  border:1px solid var(--border-subtle)}

#toasts{position:fixed;bottom:20px;right:20px;display:flex;flex-direction:column;gap:9px;z-index:200}
.toast{background:#fff;border:1px solid var(--border-subtle);border-left:4px solid var(--navy-500);
  border-radius:var(--radius-md);box-shadow:var(--shadow-lg);padding:11px 15px;font-size:13px;
  font-weight:600;min-width:250px;max-width:380px;animation:tin .25s ease-out}
.toast.success{border-left-color:var(--teal-500)}
.toast.warning{border-left-color:var(--amber-500)}
.toast.danger{border-left-color:var(--status-danger)}
@media (max-width:1180px){.login{grid-template-columns:1fr}.login-l{min-height:auto}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>
<script>
"use strict";

/* ==========================================================================
   SEED DATA — see .claude/skills/ai-native-mortgage/references/domain.md
   ========================================================================== */
var STAGES = ['Application & Intake','Loan Processing','Underwriting','Closing & Funding','Post-Closing QC'];
var PASSWORD = 'Coforge@123';

var ACCOUNTS = [
  {username:'analyst1',   role:'analyst',    name:'Priya Nair',   queue:'A',  label:'Pre-underwriting Analyst 1'},
  {username:'analyst2',   role:'analyst',    name:'Arjun Mehta',  queue:'B',  label:'Pre-underwriting Analyst 2'},
  {username:'analyst3',   role:'analyst',    name:'Lena Rossi',   queue:'C',  label:'Pre-underwriting Analyst 3'},
  {username:'supervisor', role:'supervisor', name:'Marcus Webb',  queue:null, label:'Supervisor'},
  {username:'underwriter',role:'underwriter',name:'Diane Foster', queue:null, label:'Underwriter'}
];
var QUEUE_OWNER = {A:'Priya Nair', B:'Arjun Mehta', C:'Lena Rossi'};

var TABS = [
  {id:'dashboard', label:'Dashboard',            icon:'grid'},
  {id:'pipeline',  label:'Loan Pipeline',        icon:'flow'},
  {id:'hitl',      label:'AI Exceptions & HITL', icon:'alert'},
  {id:'hub',       label:"Underwriters' Hub",    icon:'gavel'},
  {id:'approvals', label:'Approvals',            icon:'check'},
  {id:'audit',     label:'Audit Trail',          icon:'list'}
];

function seedLoans(){
  function L(id,b,type,program,amount,fico,city,st,dti,ltv){
    return {id:id,borrowers:b,type:type,program:program,amount:amount,fico:fico,city:city,st:st,
            dti:dti,ltv:ltv,stage:-1,scanned:false,ready:false,decision:null};
  }
  return [
    L('LN-2026-0001','Michael & Sarah Thompson','Purchase','Conv', 480000,742,'Austin','TX',38,80),
    L('LN-2026-0002','David Chen',              'Refi',    'FHA',  315000,681,'Phoenix','AZ',47,91),
    L('LN-2026-0003','Maria Garcia',            'Purchase','Jumbo',625000,715,'San Diego','CA',41,78),
    L('LN-2026-0004','James Wilson',            'Purchase','VA',   245000,698,'Tampa','FL',43,100),
    L('LN-2026-0005','Emily Davis',             'Refi',    'Conv', 410000,760,'Denver','CO',33,68),
    L('LN-2026-0006','Robert Johnson',          'Purchase','Conv', 530000,705,'Seattle','WA',44,85)
  ];
}

function seedExceptions(){
  var n = 0;
  function E(loanId,stage,type,severity,conf,disp,queue,rec,rationale,snap,sup){
    n++;
    return {id:'EX-'+String(n).padStart(3,'0'),loanId:loanId,stage:stage,type:type,severity:severity,
            conf:conf,disp:disp,queue:queue||null,rec:rec,rationale:rationale,snap:snap,
            requiresSup:!!sup,status:'idle',note:'',resolvedBy:null};
  }
  return [
    E('LN-2026-0001',0,'Low-confidence OCR — income','Low',71,'auto',null,
      'Re-OCR W-2 at 300dpi & cross-ref VOE',
      'Primary extraction below 0.80 confidence on box 1.',
      'W-2 Box 1: $12█,400 (blurred scan)'),
    // NOTE: the reference also carries stage-3 (TRID / Closing) exceptions. Omitted here on
    // purpose — the MVP has no Closing & Funding screen and the scan engine walks stages 0-2,
    // so a stage-3 exception would sit at `idle` forever and skew the auto-repair KPI.
    E('LN-2026-0002',0,'Income calc variance (paystub vs W-2 vs VOE)','High',64,'hitl','A',
      'Analyst reconciles qualifying income basis',
      'YTD paystub annualizes 8% above W-2; bonus seasonality unclear.',
      'Paystub $6,520/mo · W-2 $5,940/mo'),
    E('LN-2026-0002',1,'DTI exceeds program threshold (FHA 43%)','High',79,'hitl','A',
      'Evaluate compensating factors / counsel',
      'Back-end DTI 47% vs 43% cap; reserves 4 mo.',
      'DTI 47.0% · cap 43.0%', true),
    E('LN-2026-0003',1,'Appraisal value variance / high CU score','High',73,'hitl','B',
      'Order field review or rebuttal',
      'Appraisal 6% under contract; CU 3.1.',
      'Contract $625k · Appraisal $588k · CU 3.1'),
    E('LN-2026-0003',0,'Large / unsourced deposit','Medium',68,'hitl','C',
      'Request 60-day sourcing & LOX',

buildScanQueue:function(){

          return e.loanId === l.id && e.stage === stage; });
        q.push({kind:'stage', loanId:l.id, stage:stage});
        exs.forEach(function(e){
          q.push({kind:'predict', exId:e.id});

            q.push({kind:'repair', exId:e.id});

      loan.program + ' ' + loan.type + ' · ' + money(loan.amount), 'ai');

      0:['Document Intake Agent','Classified docs for '+loan.id+' — W-2 (0.97), paystub (0.95), ID (0.93); extracted borrower & income fields.'],
      1:['Processing Agent','Ordered Title, Appraisal/AMC, Flood & Credit for '+loan.id+'; LOS sync OK.'],

    e = this.exById(ev.exId); e.status = 'predicted';

    e = this.exById(ev.exId); e.status = 'repairing';
    this.logLine('Processing Agent','Auto-repair on '+e.loanId+': '+e.rec+'…','ai');
  }
  else if (ev.kind === 'resolve-auto'){
    e = this.exById(ev.exId); e.status = 'resolved'; e.resolvedBy = 'Processing Agent';
    this.logLine('Validation Agent','Resolved '+e.loanId+': '+e.type+' — auto-repaired by AI.','ai');
    this.audit('Validation Agent','AI','Auto-repaired: '+e.type, e.loanId, 'ai');
  }
  else if (ev.kind === 'route'){
    e = this.exById(ev.exId); e.status = 'routed';
    this.logLine('Workflow Orchestration Agent','Routed '+e.loanId+' ('+e.type+') to HITL Queue '+e.queue+'.','ai');

resolveException:function(exId, action, noteArg){

  var note = (noteArg != null ? noteArg : (this.state.drafts[exId] || '')).trim();

  delete this.state.drafts[exId];

  this.logLine(u.name, (labels[action]||'Resolved') + ' — ' + e.loanId + ': ' + e.type + '.', 'human');
  this.audit(u.name, u.role, (labels[action]||'Resolved') + ': ' + e.type + (note ? ' — ' + note : ''),

    ') — sent to Supervisor Approvals.', 'human');
  this.audit(u.name, u.role, 'Proposed intervention (needs sign-off): ' + e.type, e.loanId, 'human');

  this.logLine(u.name, 'Approved intervention on ' + ap.loanId + ' (' + ap.type + ') — fix applied.', 'human');
  this.audit(u.name, u.role, 'Approved intervention: ' + ap.type, ap.loanId, 'human');

  var u = this.state.user;
  if (u.role !== 'supervisor') return;
  e.queue = queue; e.status = 'routed';
  this.logLine(u.name, 'Reassigned ' + e.loanId + ' to Queue ' + queue + ' · ' + QUEUE_OWNER[queue] + '.', 'human');
  this.audit(u.name, u.role, 'Reassigned to Queue ' + queue, e.loanId, 'human');
  this.toast(e.loanId + ' reassigned to Queue ' + queue, 'info');
  this.render();
},
toggleCondition:function(loanId, condId){
  var arr = this.state.cleared[loanId] ? this.state.cleared[loanId].slice() : [];
  var i = arr.indexOf(condId);
  if (i >= 0) arr.splice(i,1); else arr.push(condId);
  this.state.cleared[loanId] = arr;
  this.render();
},
decide:function(loanId, decision){
  var l = this.loanById(loanId);
  if (!l || !l.ready || l.decision) return;
  if (!this.canDecide()) return;                // only the underwriter renders a decision
  var u = this.state.user;
  var labels = {approve:'Approved','approve-conditions':'Approved with Conditions',
                suspend:'Suspended', deny:'Denied'};
  l.decision = decision;
  l.stage = decision === 'deny' ? 2 : 3;
  this.logLine(u.name, 'Decision on ' + loanId + ': ' + labels[decision] +
    ' — auto-drafted rationale & borrower notification queued.', 'human');
  this.audit(u.name, u.role, 'Final decision: ' + labels[decision], loanId, 'human');
  this.toast(loanId + ' — ' + labels[decision], decision === 'deny' ? 'danger' : 'success');
  this.snapshot(); this.render();
},

/* ==========================================================================
   UNDERWRITING RULES
   ========================================================================== */
hubData:function(l){
  var exs = this.loanExceptions(l.id);
  function has(frag){ return exs.some(function(e){ return e.type.indexOf(frag) >= 0; }); }
  var aus = has('DU') ? {name:'DU', result:'Refer/Eligible'}
          : has('LPA') ? {name:'LPA', result:'Caution'}
          : {name: l.program === 'FHA' ? 'TOTAL' : 'DU', result:'Approve/Eligible'};
  var cu = has('Appraisal') ? 3.1 : (1.6 + (l.id.charCodeAt(8) % 7) / 10);
  var dtiCap = l.program === 'FHA' ? 43 : l.program === 'Jumbo' ? 43 : 50;
  var ltvCap = l.program === 'VA' ? 100 : l.program === 'FHA' ? 96.5 : l.program === 'Jumbo' ? 80 : 95;
  var ficoFloor = l.program === 'Jumbo' ? 700 : 620;
  var flags = [
    {label:'DTI',        val:l.dti+'%',      threshold:'≤ '+dtiCap+'%', pass:l.dti <= dtiCap},
    {label:'LTV / CLTV', val:l.ltv+'%',      threshold:'≤ '+ltvCap+'%', pass:l.ltv <= ltvCap},
    {label:'FICO',       val:String(l.fico), threshold:'≥ '+ficoFloor,  pass:l.fico >= ficoFloor},
    {label:'CU Score',   val:cu.toFixed(1),  threshold:'< 2.5',         pass:cu < 2.5},
    {label:'AUS',        val:aus.name+' '+aus.result, threshold:'Approve/Accept',
     pass:aus.result.indexOf('Approve') >= 0}
  ];
  var conditions = exs.filter(function(e){ return e.stage <= 2; }).map(function(e){
    return {id:e.id, label:'Clear: ' + e.type, source:e.snap, los:e.rec,
            auto:(e.status === 'resolved' || e.status === 'approved')};
  }).concat([
    {id:'C-INC', label:'Verify income documentation (W-2 + paystub)',
     source:'W-2 Box 1 $128,400 · Paystub YTD $64,200', los:'Qualifying income $10,700/mo', auto:false},
    {id:'C-INS', label:'Evidence of hazard insurance at closing',
     source:'HOI dec page on file', los:'Coverage ≥ loan amount', auto:false}
  ]);
  var summaries = [
    {doc:'Income package',
     text:'GenAI summary: ' + l.borrowers + ' qualify on stable W-2 wages; ' +
          (aus.result.indexOf('Approve') >= 0 ? 'income fully supports the obligation'
                                              : 'reconcile the variance flagged in processing') + '.',
     action:'Confirm qualifying income basis'},
    {doc:'Credit profile',
     text:'Representative FICO ' + l.fico + '; ' +
          (l.fico >= 720 ? 'deep, clean tradelines' : 'acceptable depth with minor derogatory aging') + '.',
     action: l.fico < 700 ? 'Document credit explanation' : 'No action'},
    {doc:'Collateral',
     text:(cu < 2.5 ? 'Appraisal supports value; CU within tolerance'
                    : 'Elevated CU — valuation review recommended') + '.',
     action: cu < 2.5 ? 'No action' : 'Order field review'}
  ];
  return {aus:aus, cu:cu, flags:flags, conditions:conditions, summaries:summaries};
},

/* ==========================================================================
   EVENTS
   ========================================================================== */
onClick:function(ev){
  var t = ev.target.closest('[data-act]');
  if (!t || t.tagName === 'SELECT') return;
  var act = t.getAttribute('data-act');
  var v = t.getAttribute('data-v'), v2 = t.getAttribute('data-v2');
  switch(act){
    case 'login':       this.doLogin(); break;
    case 'use-acct':    this.state.loginForm = {username:v, password:PASSWORD};
                        this.state.loginError = ''; this.render(); break;
    case 'logout':      this.logout(); break;
    case 'tab':         if (this.canSee(v)){ this.state.tab = v; this.render(); } break;
    case 'scan':        this.startScan(); break;
    case 'play':        this.play(); this.render(); break;
    case 'pause':       this.pause(); this.render(); break;
    case 'stepone':     this.stepOnce(); break;
    case 'speed':       this.state.speed = Number(v); this.render(); break;
    case 'reset':       this.resetDemo(); break;
    case 'hfilter':     this.state.hitlFilter[v] = v2; this.render(); break;
    case 'auditfilter': this.state.auditFilter = v; this.render(); break;
    case 'resolve':     this.resolveException(v, v2); break;
    case 'propose':     this.proposeIntervention(v, t.getAttribute('data-note')); break;
    case 'override':    this.state.overrideFor = v; this.render(); break;
    case 'override-cancel': this.state.overrideFor = null; this.render(); break;
    case 'override-submit': this.resolveException(v, 'override'); break;
    case 'approve-ap':  this.approveIntervention(v); break;
    case 'reject-ap':   this.rejectIntervention(v); break;
    case 'reassign':    this.reassign(v, v2); break;
    case 'hub-loan':    this.state.hubLoanId = v; this.render(); break;
    case 'cond':        this.toggleCondition(v, v2); break;
    case 'decide':      this.decide(v, v2); break;
  }
},
// drafts and the login form update state WITHOUT re-render, so focus is never stolen
onInput:function(ev){
  var t = ev.target;
  var d = t.getAttribute('data-draft');
  if (d){
    this.state.drafts[d] = t.value;
    var btn = document.querySelector('[data-act="override-submit"][data-v="' + d + '"]');
    if (btn) btn.disabled = !t.value.trim();
    return;
  }
  var f = t.getAttribute('data-form');
  if (f) this.state.loginForm[f] = t.value;
},
onChange:function(ev){
  if (ev.target.getAttribute('data-act') === 'switch-role') this.switchRole(ev.target.value);
},
onKey:function(ev){
  if (ev.key === 'Enter' && ev.target.getAttribute('data-form')) this.doLogin();
},

/* ==========================================================================
   RENDER
   ========================================================================== */
render:function(){
  var logEl = document.getElementById('logpane');
  var atBottom = logEl ? (logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40) : true;
  var logTop = logEl ? logEl.scrollTop : 0;
  var mainEl = document.getElementById('mainpane');
  var mainTop = mainEl ? mainEl.scrollTop : 0;
  var prevTab = this._renderedTab;

  document.getElementById('root').innerHTML =
    this.state.user ? this.viewShell() : this.viewLogin();
  this._renderedTab = this.state.tab;

  var nl = document.getElementById('logpane');
  if (nl) nl.scrollTop = atBottom ? nl.scrollHeight : logTop;
  var nm = document.getElementById('mainpane');
  if (nm && prevTab === this.state.tab) nm.scrollTop = mainTop;
},

/* ---------- charts ---------- */
chartLine:function(){
  var hist = this.state.history, W = 320, H = 130, pad = 12;
  if (hist.length < 2) return this.chartEmpty();
  var max = Math.max.apply(null, [4].concat(hist.map(function(d){
    return Math.max(d.predicted, d.repaired); })));
  var xs = function(i){ return pad + (i / (hist.length - 1)) * (W - 2*pad); };
  var ys = function(v){ return H - pad - (v / max) * (H - 2*pad - 6); };
  var path = function(key){ return hist.map(function(p,i){
    return (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p[key]).toFixed(1); }).join(' '); };
  var area = 'M' + xs(0).toFixed(1) + ' ' + ys(0).toFixed(1) + ' ' + hist.map(function(p,i){
    return 'L' + xs(i).toFixed(1) + ' ' + ys(p.predicted).toFixed(1); }).join(' ') +
    ' L' + xs(hist.length-1).toFixed(1) + ' ' + ys(0).toFixed(1) + ' Z';
  return '<div><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:130px">' +
    [0.25,0.5,0.75,1].map(function(g){
      return '<line x1="' + pad + '" x2="' + (W-pad) + '" y1="' + ys(max*g).toFixed(1) + '" y2="' +
        ys(max*g).toFixed(1) + '" stroke="var(--neutral-100)" stroke-width="1"/>'; }).join('') +
    '<path d="' + area + '" fill="rgba(240,96,72,.08)"/>' +
    '<path d="' + path('predicted') + '" fill="none" stroke="var(--coral-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path d="' + path('repaired') + '" fill="none" stroke="var(--teal-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>' + this.legend([['var(--coral-500)','Predicted'],['var(--teal-500)','Auto-repaired']]) + '</div>';
},
chartBar:function(){
  var hist = this.state.history.slice(-12), W = 320, H = 130, pad = 12;
  if (hist.length < 2) return this.chartEmpty();
  var max = Math.max.apply(null, [3].concat(hist.map(function(d){ return d.resolved; })));
  var bw = (W - 2*pad) / hist.length;
  return '<div><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:130px">' +
    hist.map(function(d,i){
      var bh = (d.resolved / max) * (H - 2*pad);
      return '<rect x="' + (pad + i*bw + 2).toFixed(1) + '" y="' + (H - pad - bh).toFixed(1) +
        '" width="' + (bw - 5).toFixed(1) + '" height="' + bh.toFixed(1) +
        '" rx="3" fill="var(--navy-500)"/>'; }).join('') +
    '</svg>' + this.legend([['var(--navy-500)','Resolutions / cleared per step']]) + '</div>';
},
chartDonut:function(){
  var ex = this.state.exceptions.filter(function(e){ return e.status !== 'idle'; });
  if (!ex.length) return this.chartEmpty();
  var order = [['Critical','var(--status-danger)'],['High','var(--amber-500)'],
               ['Medium','var(--navy-500)'],['Low','var(--teal-500)']];
  var segs = order.map(function(o){
    return {k:o[0], c:o[1], v:ex.filter(function(e){ return e.severity === o[0]; }).length};
  }).filter(function(x){ return x.v > 0; });
  var total = segs.reduce(function(a,b){ return a + b.v; }, 0) || 1;
  var r = 46, cx = 65, cy = 65, circ = 2 * Math.PI * r, off = 0;
  return '<div style="display:flex;align-items:center;gap:16px">' +
    '<svg viewBox="0 0 130 130" style="width:130px;height:130px;flex:none">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="var(--neutral-100)" stroke-width="16"/>' +
      segs.map(function(sg){
        var len = (sg.v / total) * circ;
        var el = '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + sg.c +
          '" stroke-width="16" stroke-dasharray="' + len.toFixed(2) + ' ' + (circ-len).toFixed(2) +
          '" stroke-dashoffset="' + (-off).toFixed(2) + '" transform="rotate(-90 ' + cx + ' ' + cy + ')"/>';
        off += len; return el; }).join('') +
      '<text x="' + cx + '" y="' + (cy-2) + '" text-anchor="middle" font-family="Poppins,sans-serif" font-weight="800" font-size="22" fill="#0A2140">' + total + '</text>' +
      '<text x="' + cx + '" y="' + (cy+14) + '" text-anchor="middle" font-family="Mulish,sans-serif" font-size="9" fill="#6C7889">EXCEPTIONS</text>' +
    '</svg>' +
    '<div style="display:flex;flex-direction:column;gap:6px">' + segs.map(function(sg){
      return '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px">' +
        '<span style="width:10px;height:10px;border-radius:3px;background:' + sg.c + '"></span>' +
        '<span style="color:var(--text-body)">' + sg.k + '</span>' +
        '<span class="mono" style="color:var(--text-muted);margin-left:auto">' + sg.v + '</span></div>';
    }).join('') + '</div></div>';
},
chartArea:function(){
  var hist = this.state.history, W = 320, H = 130, pad = 12, min = 28, max = 50;
  if (hist.length < 2) return this.chartEmpty();
  var xs = function(i){ return pad + (i / (hist.length - 1)) * (W - 2*pad); };
  var ys = function(v){ return pad + (1 - (v - min) / (max - min)) * (H - 2*pad); };
  var line = hist.map(function(p,i){
    return (i ? 'L' : 'M') + xs(i).toFixed(1) + ' ' + ys(p.cycle).toFixed(1); }).join(' ');
  var area = 'M' + xs(0).toFixed(1) + ' ' + (H-pad) + ' ' + hist.map(function(p,i){
    return 'L' + xs(i).toFixed(1) + ' ' + ys(p.cycle).toFixed(1); }).join(' ') +
    ' L' + xs(hist.length-1).toFixed(1) + ' ' + (H-pad) + ' Z';
  return '<div><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:130px">' +
    '<line x1="' + pad + '" x2="' + (W-pad) + '" y1="' + ys(43).toFixed(1) + '" y2="' + ys(43).toFixed(1) +
      '" stroke="var(--neutral-300)" stroke-width="1" stroke-dasharray="4 4"/>' +
    '<path d="' + area + '" fill="rgba(24,144,120,.12)"/>' +
    '<path d="' + line + '" fill="none" stroke="var(--teal-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>' + this.legend([['var(--teal-500)','Projected cycle time (days)'],
                            ['var(--neutral-300)','43-day baseline']]) + '</div>';
},

/* ---------- 2 · PIPELINE ---------- */
screenPipeline:function(){
  var s = this.state, self = this;
  var loans = s.loans.filter(function(l){ return l.scanned; });
  var counts = STAGES.map(function(_, i){
    return s.loans.filter(function(l){ return l.scanned && l.stage >= i; }).length; });
  var colors = ['var(--navy-500)','var(--coral-500)','var(--amber-500)','var(--teal-500)','var(--teal-700)'];
  var max = Math.max.apply(null, [1].concat(counts));

  var funnel = '<div class="grid g5" style="gap:12px;margin-bottom:16px">' + STAGES.map(function(st,i){
    return '<div style="background:#fff;border:1px solid var(--border-subtle);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow-sm)">' +
      '<div style="display:flex;align-items:center;justify-content:space-between">' +
        '<span style="font-size:11.5px;font-weight:700;color:var(--text-muted)">Stage ' + (i+1) + '</span>' +
        '<span style="font-family:var(--font-display);font-weight:800;font-size:26px;color:' + colors[i] + '">' +
          counts[i] + '</span></div>' +
      '<div style="font-size:12.5px;color:var(--text-strong);font-weight:600;margin:2px 0 9px;min-height:32px">' +
        esc(st) + '</div>' +
      '<div class="ds-bar"><i style="width:' + (counts[i]/max*100) + '%;background:' + colors[i] + '"></i></div>' +
    '</div>'; }).join('') + '</div>';

  var table = loans.length === 0
    ? this.emptyState('No loans scanned yet','Run the scan from the header to ingest new mortgage loan requests.')
    : this.card('Loan Pipeline', 'navy',
        '<div class="oxs-scroll" style="overflow-x:auto"><table class="tbl"><thead><tr>' +
        ['Loan ID','Borrower','Type','Program','Amount','FICO','Property','Stage','Exceptions','Status']
          .map(function(t){ return '<th>' + t + '</th>'; }).join('') +
        '</tr></thead><tbody>' + loans.map(function(l){
          var exs = self.loanExceptions(l.id);
          var open = exs.filter(function(e){
            return ['resolved','approved','idle'].indexOf(e.status) < 0; }).length;
          var st = l.decision ? ['success','Decisioned'] : l.ready ? ['success','Ready for UW']
                 : open ? ['warning', open + ' open'] : ['info','Processing'];
          var cleared = exs.filter(function(e){
            return e.status === 'resolved' || e.status === 'approved'; }).length;
          return '<tr>' +
            '<td><span class="mono" style="font-weight:600;color:var(--navy-600)">' + esc(l.id) + '</span></td>' +
            '<td><span style="font-weight:600;color:var(--text-strong)">' + esc(l.borrowers) + '</span></td>' +
            '<td>' + esc(l.type) + '</td>' +
            '<td><span class="ds-tag tag-' +
              (l.program === 'Jumbo' ? 'coral' : l.program === 'VA' ? 'teal' : 'lavender') + '">' +
              esc(l.program) + '</span></td>' +
            '<td><span class="mono">' + money(l.amount) + '</span></td>' +
            '<td><span class="mono" style="font-weight:600;color:' +
              (l.fico < 700 ? 'var(--amber-500)' : 'var(--teal-600)') + '">' + l.fico + '</span></td>' +
            '<td>' + esc(l.city + ', ' + l.st) + '</td>' +
            '<td>' + self.stageChip(l.stage) + '</td>' +
            '<td><span class="mono" style="font-weight:600">' +
              (exs.length ? cleared + '/' + exs.length : '—') + '</span></td>' +
            '<td>' + badge(st[0], st[1], true) + '</td></tr>';
        }).join('') + '</tbody></table></div>', null, true);

  var logBody = s.log.length
    ? '<div class="log oxs-scroll" id="logpane">' + s.log.map(function(g){
        return '<div class="log-l ' + g.kind + '"><span class="t">' + g.t + '</span>' +
          '<span class="a">' + esc(g.agent) + '</span>' +
          '<span style="flex:1;min-width:0">' + esc(g.text) + '</span></div>'; }).join('') + '</div>'
    : '<div class="log" id="logpane" style="padding:0 16px 16px">' +
        this.emptyState('No agent activity yet',
          'Press “Scan for New Mortgage Loan Requests” to start the pipeline.') + '</div>';

  return this.pageTitle('Loan Pipeline',
      loans.length + ' scanned requests · funnel and live status across all stages.') +
    funnel +
    '<div class="grid" style="grid-template-columns:1.5fr 1fr;align-items:start">' + table +
      this.card('Live Agent Activity','teal', logBody,
        '<span class="ds-badge" style="background:rgba(255,255,255,.2);color:#fff">' +
          (s.running ? 'Running' : 'Idle') + '</span>', true) +
    '</div>';
},

/* ---------- 3 · HITL (role-adaptive, as in the reference) ---------- */
screenHitl:function(){
  var s = this.state, u = s.user, self = this;
  var isSup = u.role === 'supervisor';
  var f = s.hitlFilter;

  var list = s.exceptions.filter(function(e){ return e.disp !== 'auto' && e.status !== 'idle'; });
  if (u.role === 'analyst')     list = list.filter(function(e){ return e.queue === u.queue; });
  if (u.role === 'underwriter') list = list.filter(function(e){
                                  return e.status === 'resolved' || e.status === 'approved'; });
  if (isSup){
    if (f.sev !== 'all')    list = list.filter(function(e){ return e.severity === f.sev; });
    if (f.queue !== 'all')  list = list.filter(function(e){ return e.queue === f.queue; });
    if (f.status !== 'all') list = list.filter(function(e){
      return f.status === 'open' ? ['routed','inqueue','pending'].indexOf(e.status) >= 0
                                 : ['resolved','approved'].indexOf(e.status) >= 0; });
  }

  var title = isSup ? 'AI Exceptions & HITL — All Queues'
            : u.role === 'analyst' ? 'My Queue — Queue ' + u.queue
            : 'AI Exceptions (read-only)';
  var sub = isSup ? 'Consolidated board of every predicted exception across loans and queues.'
          : u.role === 'analyst' ? 'Cases assigned to you, ' + u.name + '. Resolve, request docs, or escalate.'
          : 'Exception history that produced the decision-ready files.';

  var head = '';
  if (isSup){
    var seg = function(label, group, val){
      return '<button class="seg' + (f[group] === val ? ' on' : '') +
        '" data-act="hfilter" data-v="' + group + '" data-v2="' + val + '">' + label + '</button>'; };
    var grp = function(t, items){
      return '<div style="display:flex;align-items:center;gap:6px">' +
        '<span style="font-size:11.5px;font-weight:700;color:var(--text-muted);margin-right:2px">' + t +
        '</span>' + items + '</div>'; };
    head = '<div style="display:flex;flex-wrap:wrap;gap:18px;padding:12px 14px;background:#fff;' +
      'border:1px solid var(--border-subtle);border-radius:12px;margin-bottom:16px">' +
      grp('Severity', ['all','Critical','High','Medium','Low'].map(function(v){
        return seg(v === 'all' ? 'All' : v, 'sev', v); }).join('')) +
      grp('Queue', ['all','A','B','C'].map(function(v){
        return seg(v === 'all' ? 'All' : v, 'queue', v); }).join('')) +
      grp('Status', [['all','All'],['open','Open'],['done','Resolved']].map(function(v){
        return seg(v[1], 'status', v[0]); }).join('')) +
      '</div>';
  } else if (u.role === 'analyst'){
    var load = this.queueLoad(u.queue);
    head = '<div style="display:flex;align-items:center;gap:14px;padding:12px 16px;background:var(--navy-50);' +
      'border:1px solid var(--border-subtle);border-radius:12px;margin-bottom:16px">' +
      avatar(QUEUE_OWNER[u.queue], 38) +
      '<div style="flex:1"><div style="font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--text-strong)">' +
        'Queue ' + u.queue + ' · ' + esc(QUEUE_OWNER[u.queue]) + '</div>' +
        '<div style="font-size:12px;color:var(--text-muted)">' + load.open + ' open · ' + load.wip +
          ' in progress · ' + load.done + ' cleared</div></div>' +
      '<div style="width:110px">' + this.miniStat(load.open + load.wip, 'Active', 'var(--coral-500)') + '</div></div>';
  }

  var body = list.length === 0
    ? this.emptyState('No exceptions here', s.scanned ? 'Nothing matches — every case is clear.'
                                                      : 'Run the scan to generate predicted exceptions.')
    : '<div class="grid" style="grid-template-columns:' + (isSup ? '1fr 1fr' : '1fr') +
      ';gap:14px;margin-top:4px">' + list.map(function(e){ return self.excCard(e); }).join('') + '</div>';

  return this.pageTitle(title, sub) + head + body;
},
excCard:function(e){
  var s = this.state, u = s.user;
  var sv = SEV_STYLE[e.severity];
  var l = this.loanById(e.loanId);
  var done = e.status === 'resolved' || e.status === 'approved';
  var canAct = this.canActOn(e);
  var sla = this.slaFor(e);

  var foot;
  if (done){
    foot = '<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--teal-700);font-weight:600">' +
      icon('check',15,'var(--teal-600)') +
      (e.status === 'approved' ? 'Approved' : 'Resolved') +
      (e.resolvedBy ? ' by ' + esc(e.resolvedBy) : '') + (e.note ? ' — ' + esc(e.note) : '') + '</div>';
  } else if (canAct && s.overrideFor === e.id){
    foot = '<div style="background:var(--neutral-50);border:1px solid var(--border-subtle);border-radius:9px;padding:11px">' +
      '<div style="font-size:12px;font-weight:700;color:var(--text-strong);margin-bottom:6px">Override decision — note required</div>' +
      '<textarea data-draft="' + e.id + '" placeholder="Document the rationale for overriding the AI recommendation…" ' +
        'style="width:100%;min-height:56px;resize:vertical;border-radius:8px;border:1px solid var(--border-default);' +
        'padding:8px 10px;font-size:13px;outline:none">' + esc(s.drafts[e.id] || '') + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:8px">' +
        '<button class="ds-btn sm v-primary" data-act="override-submit" data-v="' + e.id + '"' +
          ((s.drafts[e.id] || '').trim() ? '' : ' disabled') + '>Submit Override</button>' +
        '<button class="ds-btn sm v-ghost" data-act="override-cancel">Cancel</button>' +
      '</div></div>';
  } else if (canAct){
    var btns = [];
    if (e.requiresSup){
      btns.push('<button class="ds-btn sm v-secondary" data-act="propose" data-v="' + e.id +
        '">Propose Fix → Supervisor</button>');
    } else {
      btns.push('<button class="ds-btn sm v-primary" data-act="resolve" data-v="' + e.id +
        '" data-v2="verify">Verify &amp; Approve</button>');
      btns.push('<button class="ds-btn sm v-outline" data-act="resolve" data-v="' + e.id +
        '" data-v2="recalc">Recalculate</button>');
    }
    btns.push('<button class="ds-btn sm v-outline" data-act="resolve" data-v="' + e.id +
      '" data-v2="request">Request Document</button>');
    btns.push('<button class="ds-btn sm v-outline" data-act="override" data-v="' + e.id + '">Override</button>');
    if (u.role === 'analyst' && !e.requiresSup){
      btns.push('<button class="ds-btn sm v-ghost" data-act="propose" data-v="' + e.id +
        '" data-note="Escalated for review">Escalate</button>');
    }
    if (u.role === 'supervisor'){
      btns.push('<span style="margin-left:auto;display:flex;gap:5px;align-items:center">' +
        '<span style="font-size:11.5px;color:var(--text-faint)">Reassign</span>' +
        ['A','B','C'].filter(function(q){ return q !== e.queue; }).map(function(q){
          return '<button class="ds-btn sm v-outline" data-act="reassign" data-v="' + e.id +
            '" data-v2="' + q + '">' + q + '</button>'; }).join('') + '</span>');
    }
    foot = '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">' + btns.join('') + '</div>';
  } else {
    foot = '<div style="font-size:12px;color:var(--text-faint)">' +
      (e.status === 'pending' ? 'Awaiting supervisor approval in the Approvals inbox.'
        : u.role === 'analyst' ? 'Owned by Queue ' + e.queue + ' · ' + esc(QUEUE_OWNER[e.queue])
        : 'Read-only') + '</div>';
  }

  return '<div class="exc' + (e.severity === 'Critical' ? ' crit' : '') + '">' +
    '<div class="top"><div style="flex:1;min-width:0">' +
      '<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
        '<span class="mono" style="font-size:12px;font-weight:600;color:var(--navy-600)">' + esc(e.loanId) + '</span>' +
        '<span style="font-size:11.5px;color:var(--text-muted)">' + esc(l ? l.borrowers : '') + '</span>' +
        '<span style="font-size:10.5px;font-weight:800;color:' + sv.c + ';background:' + sv.bg +
          ';border-radius:99px;padding:2px 8px">' + esc(e.severity) + '</span>' +
        (e.requiresSup ? badge('info','Requires Supervisor Approval') : '') +
      '</div>' +
      '<div style="font-size:14px;font-weight:700;color:var(--text-strong);margin-top:5px">' + esc(e.type) + '</div>' +
    '</div>' +
    '<div style="text-align:right;flex:none">' + this.statusBadge(e) +
      '<div style="font-size:10.5px;color:var(--text-faint);margin-top:4px">Queue ' + (e.queue || '—') + '</div>' +
    '</div></div>' +
    '<div class="bod">' +
      '<div><div style="font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;' +
        'color:var(--coral-600);display:flex;align-items:center;gap:5px;margin-bottom:4px">' +
        icon('spark',12,'var(--coral-500)') + 'AI Recommendation · ' + e.conf + '% confidence</div>' +
        '<div style="font-size:13px;color:var(--text-strong);font-weight:600">' + esc(e.rec) + '</div>' +
        '<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.45">' +
          esc(e.rationale) + '</div></div>' +
      '<div style="display:flex;gap:12px;align-items:center">' +
        '<div class="snapbox"><div class="caps">Source data snapshot</div>' +
          '<div class="mono" style="font-size:12.5px;color:var(--text-strong);margin-top:3px">' +
            esc(e.snap) + '</div></div>' +
        '<div style="width:130px;flex:none">' +
          '<div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-muted);margin-bottom:3px">' +
            '<span>SLA ' + sla.target + 'h</span><span class="mono">+' + sla.aging + 'h</span></div>' +
          '<div class="ds-bar" style="background:var(--neutral-200)"><i style="width:' + sla.pct + '%;background:' +
            (sla.pct > 75 ? 'var(--status-danger)' : sla.pct > 40 ? 'var(--amber-500)' : 'var(--teal-500)') +
            '"></i></div></div>' +
      '</div>' + foot +
    '</div></div>';
},

/* ---------- 4 · UNDERWRITERS' HUB ---------- */
screenHub:function(){
  var s = this.state;
  var ready = s.loans.filter(function(l){ return l.ready; });
  if (!ready.length) return this.pageTitle("Underwriters' Digital Hub",
      'Decision-ready files, assembled by the agents.') +
    this.emptyState('No decision-ready files yet',
      'A file arrives here once every gating exception is resolved or approved.');

  var l = ready.filter(function(x){ return x.id === s.hubLoanId; })[0] || ready[0];
  var d = this.hubData(l);
  var cleared = s.cleared[l.id] || [];
  var allClear = d.conditions.every(function(c){ return c.auto || cleared.indexOf(c.id) >= 0; });
  var canDecide = this.canDecide();

  var picker = '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">' + ready.map(function(x){
    return '<button class="seg' + (x.id === l.id ? ' on' : '') + '" data-act="hub-loan" data-v="' + x.id + '">' +
      '<span class="mono">' + esc(x.id) + '</span>' + (x.decision ? ' ✓' : '') + '</button>'; }).join('') + '</div>';

  var snapshot = [['Borrowers', l.borrowers], ['Program', l.program + ' · ' + l.type],
    ['Amount', money(l.amount)], ['Property', l.city + ', ' + l.st],
    ['FICO', String(l.fico)], ['DTI / LTV', l.dti + '% / ' + l.ltv + '%']
  ].map(function(p){
    return '<div style="padding:8px 0;border-bottom:1px solid var(--neutral-100)">' +
      '<div class="caps" style="font-size:10px">' + esc(p[0]) + '</div>' +
      '<div style="font-weight:700;color:var(--text-strong);font-size:13.5px;margin-top:2px">' +
        esc(p[1]) + '</div></div>'; }).join('');

  var flags = '<div class="oxs-scroll" style="overflow-x:auto"><table class="tbl"><thead><tr>' +
    ['Metric','Value','Policy','Result'].map(function(t){ return '<th>' + t + '</th>'; }).join('') +
    '</tr></thead><tbody>' + d.flags.map(function(fl){
      return '<tr><td style="font-weight:700;color:var(--text-strong)">' + esc(fl.label) + '</td>' +
        '<td><span class="mono">' + esc(fl.val) + '</span></td>' +
        '<td style="color:var(--text-muted)">' + esc(fl.threshold) + '</td>' +
        '<td>' + badge(fl.pass ? 'success' : 'danger', fl.pass ? 'Within policy' : 'Exception', true) +
        '</td></tr>'; }).join('') + '</tbody></table></div>';

  var conds = d.conditions.map(function(c){
    var on = c.auto || cleared.indexOf(c.id) >= 0;
    return '<div class="cond">' +
      '<button class="chk ' + (c.auto ? 'auto' : (on ? 'on' : '')) + '"' +
        (c.auto ? ' disabled title="Cleared automatically by the agents"'
                : ' data-act="cond" data-v="' + l.id + '" data-v2="' + c.id + '"') + '>' +
        (on ? icon('check',12,'#fff') : '') + '</button>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:13px;color:var(--text-body);font-weight:600">' + esc(c.label) + '</div>' +
        '<div style="font-size:11.5px;color:var(--text-muted);margin-top:2px">' + esc(c.source) +
          ' → <span class="mono">' + esc(c.los) + '</span></div></div>' +
      (c.auto ? badge('success','auto-cleared') : '') + '</div>'; }).join('');

  var summaries = d.summaries.map(function(sm){
    return '<div style="padding:10px 0;border-bottom:1px solid var(--neutral-100)">' +
      '<div style="font-weight:700;color:var(--text-strong);font-size:13px">' + esc(sm.doc) + '</div>' +
      '<div style="font-size:12.5px;color:var(--text-muted);margin-top:3px;line-height:1.5">' + esc(sm.text) + '</div>' +
      '<div style="font-size:11.5px;margin-top:4px;font-weight:700;color:' +
        (sm.action === 'No action' ? 'var(--teal-600)' : 'var(--amber-500)') + '">→ ' + esc(sm.action) +
      '</div></div>'; }).join('');

  var decLabels = {approve:'Approved','approve-conditions':'Approved with Conditions',
                   suspend:'Suspended', deny:'Denied'};
  var decision = l.decision
    ? '<div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--teal-700)">' +
        icon('check',16,'var(--teal-600)') + decLabels[l.decision] +
        ' — rationale auto-drafted, notifications queued</div>'
    : !canDecide
      ? '<div style="font-size:12.5px;color:var(--text-muted)">Only the <b>Underwriter</b> role can render a decision. ' +
        'Switch persona to Diane Foster to decide this file.</div>'
      : '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button class="ds-btn sm v-teal" data-act="decide" data-v="' + l.id + '" data-v2="approve"' +
            (allClear ? '' : ' disabled') + '>Approve</button>' +
          '<button class="ds-btn sm v-primary" data-act="decide" data-v="' + l.id +
            '" data-v2="approve-conditions">Approve with Conditions</button>' +
          '<button class="ds-btn sm v-outline" data-act="decide" data-v="' + l.id +
            '" data-v2="suspend">Suspend</button>' +
          '<button class="ds-btn sm v-danger" data-act="decide" data-v="' + l.id +
            '" data-v2="deny">Deny</button></div>' +
        (allClear ? '' : '<div style="font-size:11.5px;color:var(--text-muted);margin-top:8px">' +
          'Clear every condition to enable a clean <b>Approve</b>. Conditions the agents cleared are locked.</div>');

  return this.pageTitle("Underwriters' Digital Hub",
      'One assembled file: guideline flags, AUS finding, conditions and GenAI document summaries.') +
    picker +
    '<div class="grid" style="grid-template-columns:.85fr 1.6fr;align-items:start">' +
      '<div style="display:flex;flex-direction:column;gap:16px">' +
        this.card('File Snapshot','navy', snapshot,
          '<span class="mono" style="font-size:11.5px;color:var(--navy-100)">' + esc(l.id) + '</span>') +
        this.card('GenAI Document Summaries','teal', summaries) +
      '</div>' +
      '<div style="display:flex;flex-direction:column;gap:16px">' +
        this.card('Guideline & Risk Flags', null, flags,
          badge('neutral','AUS ' + d.aus.name + ' · ' + d.aus.result), true) +
        this.card('Conditions Checklist', null, conds,
          badge(allClear ? 'success' : 'warning', allClear ? 'All clear' : 'Outstanding', true)) +
        this.card('Underwriting Decision','coral', decision) +
      '</div>' +
    '</div>';
},

/* ---------- 5 · APPROVALS ---------- */
screenApprovals:function(){
  var s = this.state;
  if (!s.approvals.length) return this.pageTitle('Supervisor Approvals',
      'Interventions an analyst may propose but not apply.') +
    this.emptyState('Nothing awaiting sign-off',
      'Analysts send Critical and threshold-breach cases here before any fix is applied.');

  var cards = s.approvals.map(function(a){
    var pend = a.status === 'pending';
    var tone = a.status === 'approved' ? 'success' : a.status === 'rejected' ? 'danger' : 'brand';
    var label = a.status === 'approved' ? 'Approved' : a.status === 'rejected' ? 'Rejected' : 'Pending sign-off';
    return '<div class="ds-card"><div class="hd">' +
      '<span class="ttl"><span class="mono" style="color:var(--coral-600)">' + esc(a.id) + '</span> · ' +
        esc(a.type) + '</span>' + badge(tone, label, true) + '</div>' +
      '<div class="bd">' +
        '<div class="kvr"><span class="k">Loan</span>' +
          '<span class="mono" style="font-weight:700;color:var(--text-strong)">' + esc(a.loanId) + '</span></div>' +
        '<div class="kvr"><span class="k">Proposed by</span><span>' + esc(a.proposedBy) +
          ' · Queue ' + esc(a.queue) + ' · <span class="mono" style="color:var(--text-faint)">' + a.t +
          '</span></span></div>' +
        '<div style="background:var(--navy-50);border-left:3px solid var(--navy-500);border-radius:0 8px 8px 0;' +
          'padding:8px 11px;font-size:12.5px;color:var(--navy-700);margin-top:10px">' +
          '<b>AI recommendation</b><br>' + esc(a.aiRec) + '</div>' +
        '<div style="background:var(--teal-50);border-left:3px solid var(--teal-500);border-radius:0 8px 8px 0;' +
          'padding:8px 11px;font-size:12.5px;color:var(--teal-700);margin-top:8px">' +
          '<b>Analyst proposal</b><br>' + esc(a.proposedAction) + '</div>' +
        (pend ? '<input data-draft="rej-' + a.id + '" placeholder="Reason (recorded on reject)" ' +
            'style="width:100%;height:34px;padding:0 11px;margin-top:11px;border:1px solid var(--border-subtle);' +
            'border-radius:6px;font-size:12.5px;outline:none">' +
          '<div style="display:flex;gap:8px;margin-top:9px">' +
            '<button class="ds-btn sm v-teal" data-act="approve-ap" data-v="' + a.id + '">Approve &amp; Apply</button>' +
            '<button class="ds-btn sm v-danger" data-act="reject-ap" data-v="' + a.id + '">Reject &amp; Return</button>' +
          '</div>' : '') +
      '</div></div>'; }).join('<div style="height:14px"></div>');

  return this.pageTitle('Supervisor Approvals',
      'Interventions an analyst may propose but not apply. Nothing is applied without a signature.') + cards;
},

/* ---------- 6 · AUDIT ---------- */
screenAudit:function(){
  var s = this.state;
  var list = s.audit.filter(function(a){
    return s.auditFilter === 'all' || a.kind === s.auditFilter; });
  var aiN = s.audit.filter(function(a){ return a.kind === 'ai'; }).length;

  var filters = '<div style="display:flex;gap:8px;margin-bottom:16px">' +
    [['all','All entries', s.audit.length],['ai','AI agents', aiN],
     ['human','People', s.audit.length - aiN]].map(function(f){
      return '<button class="seg' + (s.auditFilter === f[0] ? ' on' : '') +
        '" data-act="auditfilter" data-v="' + f[0] + '">' + f[1] +
        ' <span class="mono" style="opacity:.7">' + f[2] + '</span></button>'; }).join('') + '</div>';

  return this.pageTitle('Audit Trail',
      'Every prediction, repair, routing decision, approval and override — immutable and attributable.') +
    filters +
    (list.length
      ? this.card(null, null,
          '<div class="oxs-scroll" style="overflow-x:auto"><table class="tbl"><thead><tr>' +
          ['Time','Actor type','Actor','Role','Action','Case'].map(function(t){
            return '<th>' + t + '</th>'; }).join('') + '</tr></thead><tbody>' +
          list.map(function(a){
            return '<tr><td><span class="mono" style="font-size:11.5px;color:var(--text-faint)">' + a.t +
                '</span></td>' +
              '<td>' + badge(a.kind === 'ai' ? 'success' : 'brand', a.kind === 'ai' ? 'AI' : 'Human', true) + '</td>' +
              '<td style="font-weight:700;color:var(--text-strong)">' + esc(a.actor) + '</td>' +
              '<td style="color:var(--text-muted)">' + esc(a.role) + '</td>' +
              '<td>' + esc(a.action) + '</td>' +
              '<td><span class="mono" style="color:var(--navy-600)">' + esc(a.caseId) + '</span></td></tr>';
          }).join('') + '</tbody></table></div>', null, true)
      : this.emptyState('No entries yet','Run the scan to start the record.'));
}

};

App.init();
</script>
</body>
</html>
